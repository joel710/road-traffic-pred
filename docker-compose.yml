services:
  # ─── Frontend (Next.js) ─────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped

  # ─── Backend Gateway API (FastAPI) ───────────────────────────
  backend:
    build:
      context: ./mini-services/api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./certs:/app/certs:ro
    restart: unless-stopped

  # ─── Traffic Simulator ───────────────────────────────────────
  simulator:
    build:
      context: ./mini-services/simulator
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - CSV_PATH=data/test.csv
    volumes:
      - ./data:/app/data:ro
      - ./certs:/app/certs:ro
    depends_on:
      backend:
        condition: service_started
    profiles:
      - full
    restart: unless-stopped

  # ─── Spark Processor ─────────────────────────────────────────
  spark-processor:
    build:
      context: ./mini-services/spark
    command: >
      spark-submit
      --master "local[*]"
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0
      spark_processor.py
    env_file:
      - .env
    environment:
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    volumes:
      - ./models:/app/models:ro
      - ./certs:/app/certs:ro
    depends_on:
      backend:
        condition: service_started
    profiles:
      - full
    restart: unless-stopped
