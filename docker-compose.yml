services:
  # ─── Backend Gateway API (FastAPI) ─────────────────────────────
  # Consumes predictions from Aiven Kafka topic 'traffic_predictions'
  # and broadcasts them to WebSocket clients (Next.js frontend).
  backend:
    build:
      context: ./mini-services/api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  # ─── Spark Structured Streaming ────────────────────────────────
  # Reads from Aiven Kafka topic 'traffic_stream', runs LSTM inference,
  # and writes predictions to Aiven Kafka topic 'traffic_predictions'.
  spark-processor:
    build:
      context: ./mini-services/spark
    command: >
      spark-submit
      --master "local[*]"
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0
      spark_processor.py
    env_file:
      - .env
    environment:
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    volumes:
      - ./models:/app/models
      - ./certs:/app/certs
    restart: unless-stopped

  # ─── Traffic Simulator ─────────────────────────────────────────
  # Reads test.csv and publishes each row to Aiven Kafka topic 'traffic_stream'.
  simulator:
    build:
      context: ./mini-services/simulator
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - CSV_PATH=data/test.csv
    volumes:
      - ./data:/app/data
      - ./certs:/app/certs
    depends_on:
      - backend
    restart: unless-stopped
