services:
  # ─── Zookeeper ───────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    user: root
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'ruok' | timeout 5 nc -z localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ─── Kafka Broker ────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo '' | timeout 5 kafka-broker-api-versions --bootstrap-server localhost:9092 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ─── Frontend (Next.js) ─────────────────────────────────────
  frontend:
    image: road-traffic-pred-frontend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_SIMULATOR_URL: http://localhost:8001
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # ─── Backend Gateway API (FastAPI) ───────────────────────────
  backend:
    image: road-traffic-pred-backend
    build:
      context: ./mini-services/api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - KAFKA_HOST=kafka
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ─── Traffic Simulator ───────────────────────────────────────
  simulator:
    image: road-traffic-pred-simulator
    build:
      context: ./mini-services/simulator
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - KAFKA_HOST=kafka
      - CSV_PATH=/app/data/test.csv
    volumes:
      - ./data:/app/data:ro
      - ./certs:/app/certs:ro
    depends_on:
      kafka:
        condition: service_healthy
      backend:
        condition: service_started
    profiles:
      - full
    restart: unless-stopped

  # ─── Spark Processor ─────────────────────────────────────────
  spark-processor:
    image: road-traffic-pred-spark-processor
    build:
      context: ./mini-services/spark
    command: >
      spark-submit
      --master "local[*]"
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0
      spark_processor.py
    env_file:
      - .env
    environment:
      - KAFKA_HOST=kafka
      - MODEL_PATH=/app/models/global_model.pt
      - SCALER_X_PATH=/app/models/scaler_x.pkl
      - SCALER_Y_PATH=/app/models/scaler_y.pkl
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    volumes:
      - ./models:/app/models:ro
      - ./certs:/app/certs:ro
    depends_on:
      kafka:
        condition: service_healthy
      backend:
        condition: service_started
    profiles:
      - full
    restart: unless-stopped
